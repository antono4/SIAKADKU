services:
  postgres:
    image: postgres:16-alpine
    container_name: siakad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: siakad
      POSTGRES_PASSWORD: siakad
      POSTGRES_DB: siakad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siakad"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: siakad-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://siakad:siakad@postgres:5432/siakad?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-please-change-access-secret-min-32-chars-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-please-change-refresh-secret-min-32-chars-long}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: siakad-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    command: node server.js

volumes:
  postgres_data:
